[project]
name = "delivery-exception-desk"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "langchain>=1.5.2",
    "langchain-groq>=1.2.1",
    "nbformat>=5.11.1",
    "plotly>=7.1.0",
    "pydantic>=2.14.4",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "ruff>=0.17.6",
]

[tool.ruff]
include = ["*.py", "*.pyi"]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.pyright]
include = ["backend"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
